# Configuración común. Los secretos y datos de conexión llegan por variables de entorno.
spring:
  application:
    name: adminpro
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # El esquema lo controla Flyway; Hibernate solo lo comprueba.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  forward-headers-strategy: native # Solo confía en X-Forwarded-For si viene de una red interna.
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  paths-to-match: /api/v1/**
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

adminpro:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-gracia: 10s
    cookie-secure: ${COOKIE_SECURE:true}
    max-intentos: 5
    bloqueo: 15m
    login-por-minuto: 10
  admin-inicial:
    correo: ${ADMIN_INICIAL_CORREO:}
    password: ${ADMIN_INICIAL_PASSWORD:}
