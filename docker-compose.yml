# Uso: copiar .env.example a .env y ejecutar "docker compose up --build".
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Copia .env.example a .env}"
      POSTGRES_USER: "${POSTGRES_USER:?Copia .env.example a .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Copia .env.example a .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - adjuntos:/data/adjuntos
    healthcheck:
      # La imagen del JRE no trae curl, por eso se consulta con bash.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 &&
          grep -q UP <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db_data:
  adjuntos:
