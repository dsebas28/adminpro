server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un poco más que el máximo de 10 MB por adjunto, por el resto del formulario.
    client_max_body_size 11m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se sobrescribe lo que envió el cliente: si se conservara, podría falsificar su IP
        # y evadir el límite de intentos del login (D-31).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Los archivos con hash en el nombre nunca cambian.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # tema-inicial.js no lleva hash, así que no se guarda en caché.
    location = /tema-inicial.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # Rutas de Angular. index.html no se guarda en caché para que llegue cada versión nueva.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
